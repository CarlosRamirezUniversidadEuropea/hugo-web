{{ define "main" }}
  <header class="page-head site-wrap">
    <h1>{{ .Title }}</h1>
    {{- with .Description }}
      <p>{{ . }}</p>
    {{- end }}
  </header>

  <section class="section site-wrap">
    {{- $pages := .RegularPages.ByDate.Reverse }}
    {{- with $pages }}
      <div class="card-grid">
        {{- range . }}
          {{ partial "tutorial-card.html" . }}
        {{- end }}
      </div>
    {{ else }}
      <p class="empty">No tutorials yet. Check back soon.</p>
    {{ end }}
  </section>
{{ end }}

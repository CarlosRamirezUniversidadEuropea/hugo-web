<footer class="site-footer" role="contentinfo">
  <div class="site-wrap site-footer__inner">
    <span>&copy; {{ now.Year }} {{ site.Title }}</span>
    <div class="site-footer__links">
      {{- range site.Params.social }}
        <a href="{{ .url }}" target="_blank" rel="noopener">{{ .name }}</a>
      {{- end }}
    </div>
  </div>
</footer>

<a class="bmc-float"
   href="https://buymeacoffee.com/{{ site.Params.bmc_username }}"
   target="_blank" rel="noopener"
   aria-label="Buy me a coffee - opens in a new window">
  <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
    <path d="M3 8h13v6a6 6 0 0 1-6 6H9a6 6 0 0 1-6-6V8zm13 2h1.5a2.5 2.5 0 0 1 0 5H16v-2h1.5a.5.5 0 0 0 0-1H16v-2z"/>
    <path d="M7 1.5c1 1.2 1 2.3 0 3.5l-.6.6c-.4.4-.4.9 0 1.3M11 1.5c1 1.2 1 2.3 0 3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
  </svg>
  <span>Buy me a coffee</span>
</a>
